<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:image" content="{% if page.og_image %}{{ page.og_image | absolute_url }}{% else %}{{ '/assets/social-card.png' | absolute_url }}{% endif %}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/assets/al-logo.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    {% if page.layout == 'post' %}
      <link rel="stylesheet" href="{{ '/post.css' | relative_url }}">
    {% elsif page.extra_css %}
      <link rel="stylesheet" href="{{ page.extra_css | relative_url }}">
    {% endif %}
  </head>
  <body id="top" data-baseurl="{{ site.baseurl }}">
    {% include nav.html %}
    <main>{{ content }}</main>
    {% include footer.html %}
    <script src="{{ '/script.js' | relative_url }}"></script>
  </body>
</html>
