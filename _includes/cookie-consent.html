<aside class="consentBanner" data-consent-banner hidden aria-labelledby="consent-title" aria-describedby="consent-description">
  <div class="consentBannerCopy">
    <p class="eyebrow">Your privacy</p>
    <h2 id="consent-title">May I use privacy-conscious analytics?</h2>
    <p id="consent-description">Google Analytics helps me understand which pages are useful. It remains completely blocked unless you accept. Your choice does not affect access to the site.</p>
    <a href="{{ '/cookies/' | relative_url }}">Cookie details</a>
  </div>
  <div class="consentBannerActions">
    <button type="button" class="consentChoice consentChoice--essential" data-consent-reject>Essential only</button>
    <button type="button" class="consentChoice consentChoice--accept" data-consent-accept>Accept analytics</button>
  </div>
</aside>
