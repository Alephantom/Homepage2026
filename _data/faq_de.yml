# Homepage FAQ (German), shown on de/index.html in this order and numbered 01, 02, …
# Same format as faq_en.yml: the items also become the FAQPage structured data.
# Links use a site path, e.g. <a href="/de/team-snapshot/">.

- question: Woran können wir gemeinsam arbeiten?
  answer: >-
    Ich unterstütze bei Positionierung und digitaler Präsenz, Operations und Prozessklarheit, People- und Teamsystemen, verantwortungsvoller KI und der praktischen Infrastruktur, die kleinen Unternehmen und wachsenden Teams gute Arbeit ermöglicht.

- question: Was unterscheidet den kostenlosen Team-Snapshot vom kostenlosen Orientierungsgespräch?
  answer: >-
    Den kostenlosen <a href="/de/team-snapshot/">Team-Snapshot</a> machst du allein, in fünf Minuten: sechs Fragen, ein sofortiges Ergebnis für jeden Bereich, praktische Tipps und ein PDF zum Behalten. Ohne Anmeldung. Im kostenlosen 30-minütigen Orientierungsgespräch sprechen wir gemeinsam: Wir schauen uns dein Ergebnis oder deine Situation an und klären, ob Interim-HR, ein Workshop oder etwas anderes der passende nächste Schritt ist.

- question: Können wir mit etwas Kleinem beginnen?
  answer: >-
    Ja. Starte mit dem kostenlosen Team-Snapshot oder einem kostenlosen 30-minütigen Orientierungsgespräch. Ein einzelner Workshop von ein bis zwei Stunden ist ein kleiner, klarer erster Schritt für dein Team. Interim-HR stimmen wir auf deine Situation ab, und du musst dich nicht von Anfang an auf ein größeres Projekt festlegen.

- question: Wie sieht Interim-HR oder eine Elternzeitvertretung aus?
  answer: >-
    Ich komme als erfahrene HR Business Partnerin in dein Team: für eine Vakanz, eine Elternzeit oder eine Wachstumsphase. Dazu gehören Recruiting und Onboarding, HR-Prozesse und Struktur, HR-Operations und Benefits, Daten und Reporting sowie Unterstützung für Teamleads. Einsatzzeit, Dauer und Honorar stimmen wir auf deine Situation ab.

- question: Arbeitest du remote oder vor Ort?
  answer: >-
    Strategische Begleitung und Umsetzungsprojekte laufen meist remote. Wenn es deinem Team hilft, komme ich auch gern zu euch. Workshops sind nach Absprache remote oder vor Ort möglich.

- question: Was passiert nach dem ersten Gespräch?
  answer: >-
    Wenn die Zusammenarbeit sinnvoll passt, empfehle ich ein Format und kläre Umfang, Zeitrahmen, Verantwortlichkeiten und Honorar, bevor die Arbeit beginnt. Wenn ein anderer Weg hilfreicher wäre, sage ich das ebenfalls.

- question: Wie laufen die Workshops ab?
  answer: >-
    Jeder Workshop dreht sich um ein Thema: faire KI im Recruiting, Bias-Bewusstsein im Team, berufstätige Eltern halten, Remote-Teams, die funktionieren, oder konstruktive Kommunikation mit Praxisübungen. Ein Workshop dauert ein bis zwei Stunden oder wird individuell für dein Team gestaltet, remote oder vor Ort, auf Deutsch, Englisch oder Spanisch. Umfang und Honorar klären wir, bevor es losgeht.
