# Topics for the "What’s it about?" / "Worum geht es?" select on /contact and /de/kontakt/.
#
# Links open the contact form with a topic already selected:
#   {{ '/contact' | relative_url }}?topic=interim#write
#   {{ '/de/kontakt/' | relative_url }}?topic=interim#schreiben
# Unknown or missing topics fall back to "general". See README, "Contact topics".
#
# - slug:          sent to Formspree as the "topic" field. Keep slugs stable: links across the site use them.
# - label:         the option text in the select. The form’s email subject becomes "New enquiry: <label>"
#                  ("Neue Anfrage: <label>"); "general" keeps the page’s plain subject line.
# - email_subject: the subject line of the email draft when the page shows the email address instead of the form.
# - email_body:    optional starting note for that email draft, used when no other page handed over a message.
#
# Groups with a label become <optgroup>s; a group without a label is listed on its own, at the end.

- label:
    en: Offers
    de: Angebote
  topics:
    - slug: interim
      en:
        label: Interim HR & parental-leave cover
        email_subject: Interim HR & parental-leave cover
      de:
        label: Interim-HR & Elternzeitvertretung
        email_subject: Interim-HR & Elternzeitvertretung anfragen
    - slug: workshop
      en:
        label: Workshop
        email_subject: Asking about a workshop
      de:
        label: Workshop
        email_subject: Workshop anfragen
    - slug: team-snapshot
      en:
        label: Talk about my Team Snapshot results
        email_subject: Talking about my Team Snapshot results
        email_body: |-
          Hi Anna-Lena,

          I’ve done the free Team Snapshot and I’d like to talk through my results in a free 30-minute orientation call.

          What I’d like to talk about:
      de:
        label: Über mein Team-Snapshot-Ergebnis sprechen
        email_subject: Über mein Team-Snapshot-Ergebnis sprechen
        email_body: |-
          Hallo Anna-Lena,

          ich habe den kostenlosen Team-Snapshot gemacht und würde mein Ergebnis gern in einem kostenlosen 30-minütigen Orientierungsgespräch mit dir besprechen.

          Worüber ich sprechen möchte:

- topics:
    - slug: general
      en:
        label: Something else
        email_subject: Let’s see how we can work together
      de:
        label: Etwas anderes
        email_subject: Lass uns schauen, wie wir zusammenarbeiten können
