# Topics for the "What’s it about?" / "Worum geht es?" select on /contact.html and /de/kontakt/.
#
# Links open the contact form with a topic already selected:
#   {{ '/contact.html' | relative_url }}?topic=clarity-check#write
#   {{ '/de/kontakt/' | relative_url }}?topic=clarity-check#schreiben
# Unknown or missing topics fall back to "general". See README, "Contact topics".
#
# - slug:          sent to Formspree as the "topic" field. Keep slugs stable: links across the site use them.
# - label:         the option text in the select. The form’s email subject becomes "New enquiry: <label>"
#                  ("Neue Anfrage: <label>"); "general" keeps the page’s plain subject line.
# - email_subject: the subject line of the email draft when the page shows the email address instead of the form.
# - email_body:    optional starting note for that email draft, used when no other page handed over a message.
#
# Groups with a label become <optgroup>s; a group without a label is listed on its own, at the end.

- label:
    en: Offers
    de: Angebote
  topics:
    - slug: clarity-check
      en:
        label: Clarity Check
        email_subject: Booking a Clarity Check
        email_body: |-
          Hi Anna-Lena,

          I’d like to book a Clarity Check.

          The challenge I’d like to look at:

          Our team (what we do, roughly how many people):
      de:
        label: Clarity Check
        email_subject: Clarity Check buchen
        email_body: |-
          Hallo Anna-Lena,

          ich möchte einen Clarity Check buchen.

          Die Herausforderung, um die es gehen soll:

          Unser Team (was wir machen, ungefähr wie viele Personen):
    - slug: focused-build
      en:
        label: Focused Build
        email_subject: Planning a Focused Build
      de:
        label: Focused Build
        email_subject: Focused Build planen
    - slug: interim-hr
      en:
        label: Interim HR Business Partner
        email_subject: Interim HR support
      de:
        label: Interim HR Business Partner
        email_subject: Interim-HR-Begleitung anfragen
    - slug: team-snapshot
      en:
        label: Team Snapshot
        email_subject: A question about the Team Snapshot
      de:
        label: Team-Snapshot
        email_subject: Eine Frage zum Team-Snapshot

