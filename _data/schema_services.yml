# Services in the structured data (JSON-LD) of the homepages and the Team Snapshot pages.
# A page lists the ones it shows in its front matter, e.g. schema_services: [interim_hr, workshops, team_snapshot].
# Nothing here is displayed on the page, but it has to describe what every page that lists it shows:
# - name: the offer's heading on the page.
# - description: a short summary of the visible offer. Update it when the offer's content changes.
# - path: the offer's main page per language, with the offer card's id where it shares a page. The service's url and @id
#   (that page + #service-<key>) come from it, so each offer is one entity on every page.
# - price: free = an Offer with price 0; on_request = no price in the structured data (no prices are shown on the site).

interim_hr:
  path:
    en: /#interim-hr-business-partner
    de: /de/#interim-hr-business-partner
  price: on_request
  en:
    name: Interim HR & parental-leave cover
    description: "An experienced HR Business Partner in your team, for a gap, a leave or a growth phase: recruiting & onboarding, HR processes & structure, HR operations & benefits, data & reporting and support for team leads. Time commitment, duration and fee are agreed around your situation."
  de:
    name: Interim-HR & Elternzeitvertretung
    description: "Eine erfahrene HR Business Partnerin in Ihrem Team: für eine Vakanz, eine Elternzeit oder eine Wachstumsphase. Recruiting & Onboarding, HR-Prozesse & Struktur, HR-Operations & Benefits, Daten & Reporting und Unterstützung für Teamleads. Einsatzzeit, Dauer und Honorar werden auf Ihre Situation abgestimmt."

workshops:
  path:
    en: /#workshops
    de: /de/#workshops
  price: on_request
  en:
    name: Workshops
    description: "Workshops for founders, decision-makers and team leads on fair AI in recruiting, bias awareness in teams, keeping working parents on board, making remote teams work and constructive communication with hands-on practice. 1–2 hours or tailored to your team, remote or on-site."
  de:
    name: Workshops
    description: "Workshops für Gründer:innen, Entscheider:innen und Teamleads zu fairer KI im Recruiting, Bias-Bewusstsein im Team, berufstätigen Eltern, Remote-Teams und konstruktiver Kommunikation mit Praxisübungen. 1–2 Stunden oder individuell für Ihr Team, remote oder vor Ort."

team_snapshot:
  price: free
  path:
    en: /team-snapshot/
    de: /de/team-snapshot/
  en:
    name: Team Snapshot
    description: "A free five-minute self-assessment: six questions about how work runs today, an instant score for each area, practical tips and a PDF to keep. No sign-up needed."
  de:
    name: Team-Snapshot
    description: "Eine kostenlose Selbsteinschätzung in fünf Minuten: sechs kurze Fragen dazu, wie die Arbeit in Ihrem Team gerade läuft, ein sofortiges Ergebnis für jeden Bereich, praktische Tipps und ein PDF zum Behalten. Ohne Anmeldung."
