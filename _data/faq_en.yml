- question: When is the right time to bring you in?
  answer: >-
    When your team has grown but too much still runs through you: decisions wait for you, delegated work comes back to you, and you answer the same questions again and again. If you’re not sure yet where to start, the free <a href="/team-snapshot/">Team Snapshot</a> gives you a first picture in two minutes. When you know which challenge you want to work on, a Clarity Check is the next step. If you need cover for parental leave, sick leave or an open role, <a href="/#interim-hr-business-partner">interim HR support</a> is the better fit.

- question: What can we work on together?
  answer: >-
    Mainly on helping a growing team rely less on its founders: who owns what, which decisions people can make, and the everyday processes behind onboarding, handovers and recurring work. I also step in as an Interim HR Business Partner, run team workshops (including one on responsible AI in hiring), and help with positioning and websites, together with my technical partner DevOpWeb when a project needs technical depth.

- question: How is the free Team Snapshot different from the Clarity Check?
  answer: >-
    The free <a href="/team-snapshot/">Team Snapshot</a> is a two-minute self-assessment: six questions, an instant score for each area, practical tips and a PDF to keep. The paid Clarity Check goes deeper into one defined challenge: we talk it through, I review the documents and processes involved, and you get a written priority plan and a follow-up conversation.

- question: Can we begin with something small?
  answer: >-
    Yes. We can start with one question or a Clarity Check. If the Clarity Check shows problems that keep coming back, a Focused Build can tackle up to three of them next. Any larger piece of work is decided after the first step, rather than committed to up front.

- question: Do you work remotely or in person?
  answer: >-
    Most strategy and build work can happen remotely. I’m also available in person when that would be useful for your team. Workshops can be remote or in person by agreement.

- question: What happens after the first conversation?
  answer: >-
    If there is a useful fit, I will recommend a format and make the scope, timing, responsibilities, and fee clear before any work begins. If another direction would serve you better, I will say that too.

- question: How do team workshops work?
  answer: >-
    Workshops are shaped around one topic and combine practical exercises, discussion and next steps. They run two to four hours, start from {price.workshops} and include a short briefing beforehand, a workbook on the topic and a written recap afterwards. Larger groups and in-person sessions are quoted separately.
