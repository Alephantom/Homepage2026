- question: What can we work on together?
  answer: >-
    I help with positioning and digital presence, operations and process clarity, people and team systems, responsible AI, and the practical infrastructure that helps a small business or growing team work well.

- question: How is the free Team Snapshot different from the free orientation call?
  answer: >-
    The free <a href="/team-snapshot/">Team Snapshot</a> is a five-minute self-assessment you do on your own: six questions, an instant score for each area, practical tips and a PDF to keep. No sign-up needed. In the free 30-minute orientation call we talk it through together: we look at your results or your situation and work out whether interim HR, a workshop or something else is the right next step.

- question: Can we begin with something small?
  answer: >-
    Yes. Start with the free Team Snapshot or a free 30-minute orientation call. A single workshop of one to two hours is a small, clear first step for your team. Interim HR support is shaped around your situation, and nothing larger is committed to up front.

- question: What does interim HR or parental-leave cover look like?
  answer: >-
    I join your team as an experienced HR Business Partner for a gap, a parental leave or a growth phase: recruiting and onboarding, HR processes and structure, HR operations and benefits, data and reporting, and support for team leads. Time commitment, duration and fee are agreed around your situation.

- question: Do you work remotely or in person?
  answer: >-
    Most strategy and build work can happen remotely. I’m also available in person when that would be useful for your team. Workshops can be remote or in person by agreement.

- question: What happens after the first conversation?
  answer: >-
    If there is a useful fit, I will recommend a format and make the scope, timing, responsibilities, and fee clear before any work begins. If another direction would serve you better, I will say that too.

- question: How do workshops work?
  answer: >-
    Each workshop focuses on one topic: fair AI in recruiting, bias awareness in teams, keeping working parents on board, making remote teams work, or constructive communication with hands-on practice. Sessions run one to two hours or are tailored to your team, remote or on-site, in German, English or Spanish. Scope and fee are agreed before we start.
