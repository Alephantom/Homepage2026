  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  # Keep images and downloads (such as PDFs) in assets/ out of sitemap.xml; only pages are listed.
  - scope:
      path: "assets"
    values:
      sitemap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - MEMORY.md
  - README.md
  - vendor
